<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文件掃描器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f5f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#1a73e8;--bd:#dcdcd6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#222;--tx:#eee;--mu:#9a9a94;--ac:#6ea8fe;--bd:#3a3a38}}
:root[data-theme="dark"]{--bg:#161616;--card:#222;--tx:#eee;--mu:#9a9a94;--ac:#6ea8fe;--bd:#3a3a38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding:12px;max-width:640px;margin:auto}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer;display:inline-block}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
canvas{max-width:100%;display:block;margin:auto;border-radius:6px}
#ed{touch-action:none;width:100%}
.hide{display:none}
.mu{color:var(--mu);font-size:13px}
label{font-size:14px;display:flex;gap:4px;align-items:center}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pg{border:1px solid var(--bd);border-radius:8px;padding:6px;text-align:center}
.pg img{width:100%;border-radius:4px;background:#fff}
.pg button{padding:4px 8px;font-size:12px;margin:2px}
.pg img{cursor:pointer}
</style></head><body>
<h1>📄 文件掃描器</h1>

<div class="card" id="s0">
  <label class="btn pri" for="f">📷 拍攝／選擇文件</label>
  <input id="f" type="file" accept="image/*" capture="environment" class="hide">
  <button id="openauto">🎥 連續自動拍攝</button>
  <p id="cvst" class="mu" style="margin:4px 0 0">⏳ 精準偵測模組（OpenCV）載入中，期間先使用基本偵測…</p>
  <p id="camerr" class="hide" style="color:#d93025;font-size:14px;margin:8px 0 0"></p>
  <p class="mu">手機會開啟相機；電腦可選擇圖片。文件盡量放在顏色對比明顯的桌面上。</p>
</div>

<div class="card hide" id="s3">
  <b>連續自動拍攝</b>
  <div style="position:relative;margin-top:8px"><video id="vid" playsinline muted style="width:100%;border-radius:8px;background:#000;display:block"></video><canvas id="ovl" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;margin:0"></canvas></div>
  <div class="row">
    <label>每 <input type="number" id="iv" value="3" min="1" max="60" style="width:56px;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)"> 秒拍一張</label>
    <select id="amd"><option value="color">彩色</option><option value="gray">灰階</option><option value="bw">黑白</option></select>
  </div>
  <div class="row">
    <select id="bk"><option value="1">單頁文件</option><option value="L">書本攤開：只存左頁</option><option value="R">書本攤開：只存右頁</option><option value="B">書本攤開：左右兩頁都存</option></select>
    <label><input type="checkbox" id="ash" checked>去陰影</label>
    <label><input type="checkbox" id="afg" checked>去手指</label>
    <span class="mu">※ 必須偵測到完整文件並穩定後才會拍攝</span>
    <label><input type="checkbox" id="adup" checked>略過重複頁面</label>
    <label><input type="checkbox" id="asnd" checked>🔊 啵聲提示</label>
  </div>
  <div class="row"><button class="pri" id="go">▶ 開始</button><button id="closeauto">結束並返回</button></div>
  <p class="mu" id="ast"></p>
</div>

<div class="card hide" id="s1">
  <b>① 確認邊緣</b> <span class="mu">拖曳四個圓點調整</span><p id="dm" class="mu" style="margin:6px 0 0"></p>
  <canvas id="ed"></canvas>
  <div class="row"><button id="redo">重新偵測</button><button class="pri" id="crop">裁切並拉直 →</button><button id="cancel1">取消</button></div>
</div>

<div class="card hide" id="s2">
  <b>② 清理效果</b>
  <canvas id="pv" style="margin-top:8px;border:1px solid var(--bd)"></canvas>
  <div class="row">
    <label><input type="checkbox" id="sh" checked>去陰影</label>
    <label><input type="checkbox" id="fg" checked>去手指</label>
    <select id="md"><option value="color">彩色</option><option value="gray">灰階</option><option value="bw">黑白</option></select>
  </div>
  <div class="row"><label>亮度 <input type="range" id="br" min="-60" max="60" value="0"></label><label>對比 <input type="range" id="ct" min="60" max="180" value="100"></label></div>
  <div class="row"><button id="rl">⟲ 左轉</button><button id="rr">⟳ 右轉</button><button id="rst">重設效果</button></div>
  <div class="row"><button class="pri" id="save">儲存為 JPG 頁面</button><button id="back">← 調整邊緣</button><button id="cancel2">取消</button></div>
  <p class="mu" id="st"></p>
</div>

<div class="card">
  <b>已掃描頁面 <span id="cnt">(0)</span></b>
  <div id="list" style="margin-top:8px"></div>
  <p class="mu" id="empty">尚無頁面</p>
  <div class="row"><button class="pri" id="pdf" disabled>輸出 PDF</button><button id="clr" disabled>清空全部</button></div>
</div>

<script>
const $=id=>document.getElementById(id);
let HH,src,corners=[],raw,res,pages=[],drag=-1,K=1;

/* ---------- 工具 ---------- */
function box(a,w,h,r){const t=new Float32Array(a.length),o=new Float32Array(a.length),n=2*r+1,cl=(v,m)=>v<0?0:v>m?m:v;
 for(let y=0;y<h;y++){const b=y*w;let s=0;for(let x=-r;x<=r;x++)s+=a[b+cl(x,w-1)];
  for(let x=0;x<w;x++){t[b+x]=s/n;s+=a[b+cl(x+r+1,w-1)]-a[b+cl(x-r,w-1)];}}
 for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=t[cl(y,h-1)*w+x];
  for(let y=0;y<h;y++){o[y*w+x]=s/n;s+=t[cl(y+r+1,h-1)*w+x]-t[cl(y-r,h-1)*w+x];}}
 return o}
function mx(a,w,h,r){const t=new Float32Array(a.length),o=new Float32Array(a.length);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let m=0;for(let k=-r;k<=r;k++){const xx=x+k;if(xx>=0&&xx<w&&a[y*w+xx]>m)m=a[y*w+xx]}t[y*w+x]=m}
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let m=0;for(let k=-r;k<=r;k++){const yy=y+k;if(yy>=0&&yy<h&&t[yy*w+x]>m)m=t[yy*w+x]}o[y*w+x]=m}
 return o}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

/* ---------- 自動偵測邊緣（含嚴格驗證） ---------- */
function shrink(P,f){const cx=P.reduce((a,p)=>a+p[0],0)/4,cy=P.reduce((a,p)=>a+p[1],0)/4;return P.map(p=>[cx+(p[0]-cx)*f,cy+(p[1]-cy)*f])}
function detect(c,mD=320){
 const k=Math.min(1,mD/Math.max(c.width,c.height)),w=Math.round(c.width*k),h=Math.round(c.height*k),n=w*h;
 const x=mk(w,h).getContext('2d',{willReadFrequently:true});x.drawImage(c,0,0,w,h);
 const d=x.getImageData(0,0,w,h).data,g=new Float32Array(n),hist=new Array(256).fill(0);
 for(let i=0;i<n;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
 const b=box(g,w,h,Math.max(1,Math.round(w/160)));for(let i=0;i<n;i++)hist[b[i]|0]++;
 let sum=0,sB=0,wB=0,best=0,th=128,gap=0;for(let i=0;i<256;i++)sum+=i*hist[i];
 for(let i=0;i<256;i++){wB+=hist[i];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=i*hist[i];
  const m1=sB/wB,m2=(sum-sB)/wF,v=wB*wF*(m1-m2)*(m1-m2);if(v>best){best=v;th=i;gap=m2-m1}}
 const dflt=[[.05,.05],[.95,.05],[.95,.95],[.05,.95]].map(p=>[p[0]*c.width,p[1]*c.height]),U=P=>P.map(p=>[p[0]/k,p[1]/k]);
 const lab=new Uint8Array(n),st=new Int32Array(n),rA=new Int16Array(h),rB=new Int16Array(h),comps=[];
 for(let s=0;s<n;s++){if(lab[s]||b[s]<=th)continue;
  let sp=0,a=0,m1=1e9,M1=-1e9,m2=1e9,M2=-1e9,P=[0,0,0,0],X0=w,X1=0,Y0=h,Y1=0;rA.fill(32767);rB.fill(-1);st[sp++]=s;lab[s]=1;
  while(sp){const p=st[--sp],px=p%w,py=(p/w)|0;a++;const s1=px+py,s2=px-py;
   if(s1<m1){m1=s1;P[0]=[px,py]}if(s1>M1){M1=s1;P[2]=[px,py]}if(s2>M2){M2=s2;P[1]=[px,py]}if(s2<m2){m2=s2;P[3]=[px,py]}
   if(px<X0)X0=px;if(px>X1)X1=px;if(py<Y0)Y0=py;if(py>Y1)Y1=py;if(px<rA[py])rA[py]=px;if(px>rB[py])rB[py]=px;
   for(const q of [p-1,p+1,p-w,p+w]){if(q<0||q>=n||lab[q]||b[q]<=th)continue;
    if((q===p-1&&px===0)||(q===p+1&&px===w-1))continue;lab[q]=1;st[sp++]=q}}
  if(a>=n*.08){let fa=0;for(let y=Y0;y<=Y1;y++)if(rB[y]>=0)fa+=rB[y]-rA[y]+1;comps.push({a,P,X0,X1,Y0,Y1,fa})}}
 const D=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
 const chk=m=>{const P=m.P,e=Math.max(2,w*.012);
  if(gap<28)return '文件與背景對比不足，請放在深色桌面';
  if(m.X0<e||m.Y0<e||m.X1>w-1-e||m.Y1>h-1-e)return '請讓整份文件完整入鏡';
  let A=0,sg=0;for(let i=0;i<4;i++){const a=P[i],q=P[(i+1)%4],r=P[(i+2)%4];A+=a[0]*q[1]-q[0]*a[1];
   const cr=(q[0]-a[0])*(r[1]-q[1])-(q[1]-a[1])*(r[0]-q[0]);if(cr<=0)sg=1}
  A=Math.abs(A/2);if(sg)return '偵測到的形狀不像文件';
  if(A<n*.1)return '文件太小，請靠近一點';
  if(m.fa/A<.8)return '邊緣不夠方正，可能被遮住';
  const L=[D(P[0],P[1]),D(P[1],P[2]),D(P[2],P[3]),D(P[3],P[0])];
  if(Math.min(...L)<w*.12||Math.min(L[0],L[2])/Math.max(L[0],L[2])<.5||Math.min(L[1],L[3])/Math.max(L[1],L[3])<.5)return '文件角度太歪，請放正一些';
  const ra=(L[0]+L[2])/(L[1]+L[3]);if(ra<.25||ra>4)return '形狀比例不像文件';return ''};
 let why='畫面中找不到文件',cand=null;comps.sort((p,q)=>q.a-p.a);
 for(const m of comps){const e=chk(m);if(!e)return{ok:true,pts:shrink(U(m.P),.992),why:''};if(!cand){cand=U(m.P);why=e}}
 return{ok:false,pts:dflt,cand,why}}

/* 拍攝後自動修掉殘留背景（只在四邊 3% 內，偏暗就裁掉），回傳新角點；無需修剪回傳 null */
function autoTrim(r,P){
 const q=Math.min(1,300/Math.max(r.width,r.height)),w=Math.round(r.width*q),h=Math.round(r.height*q),t=mk(w,h).getContext('2d',{willReadFrequently:true});
 t.drawImage(r,0,0,w,h);const d=t.getImageData(0,0,w,h).data,g=i=>.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
 const cs=[];for(let y=h*.2|0;y<h*.8;y++)for(let x=w*.2|0;x<w*.8;x++)cs.push(g(y*w+x));cs.sort((a,b)=>a-b);
 const ref=cs[cs.length>>1]*.72,mT=Math.round(Math.min(w,h)*.03);
 const sc=(len,at)=>{let n=0;const a=len*.1|0,e=len*.9|0;while(n<mT){let s=0;for(let i=a;i<e;i++)s+=at(i,n);if(s/(e-a)>=ref)break;n++}return n?n+1:0};
 const L=sc(h,(i,n)=>g(i*w+n))/w,R=1-sc(h,(i,n)=>g(i*w+w-1-n))/w,T=sc(w,(i,n)=>g(n*w+i))/h,B=1-sc(w,(i,n)=>g((h-1-n)*w+i))/h;
 if(!L&&!T&&R===1&&B===1)return null;
 const lp=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u],pt=(u,v)=>lp(lp(P[0],P[1],u),lp(P[3],P[2],u),v);
 return [pt(L,T),pt(R,T),pt(R,B),pt(L,B)]}

/* ---------- OpenCV 偵測：邊緣＋輪廓＋四邊形擬合＋邊緣支持度驗證＋直線擬合精修 ---------- */
let cvReady=false;
function fitLn(P){const f=(Q)=>{const n=Q.length;let mx=0,my=0;Q.forEach(p=>{mx+=p[0];my+=p[1]});mx/=n;my/=n;let a=0,b=0,c=0;Q.forEach(p=>{const x=p[0]-mx,y=p[1]-my;a+=x*x;b+=x*y;c+=y*y});
 const t=.5*Math.atan2(2*b,a-c);return{x:mx,y:my,dx:Math.cos(t),dy:Math.sin(t)}},dist=(l,p)=>Math.abs((p[0]-l.x)*l.dy-(p[1]-l.y)*l.dx);
 let l=f(P);const ds=P.map(p=>dist(l,p)).sort((a,b)=>a-b),th=Math.max(1.2,ds[ds.length>>1]*2.5),K=P.filter(p=>dist(l,p)<=th);return K.length>=10?f(K):l}
function refineQuad(ed,W,H,Q){const E=ed.data,band=Math.max(3,Math.round(Math.max(W,H)*.006)),L=[];
 for(let i=0;i<4;i++){const a=Q[i],b=Q[(i+1)%4],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len,pts=[];
  for(let s=.08;s<=.92;s+=.01){const bx=a[0]+dx*s,by=a[1]+dy*s;let bo=null,bd=1e9;
   for(let o=-band;o<=band;o++){const X=Math.round(bx+nx*o),Y=Math.round(by+ny*o);if(X<0||Y<0||X>=W||Y>=H)continue;if(E[Y*W+X]&&Math.abs(o)<bd){bd=Math.abs(o);bo=[X,Y]}}
   if(bo)pts.push(bo)}
  if(pts.length<25)return Q;L.push(fitLn(pts))}
 const dg=Math.hypot(W,H);return Q.map((q,i)=>{const p=L[(i+3)%4],r=L[i],det=p.dx*(-r.dy)-p.dy*(-r.dx);if(Math.abs(det)<.2)return q;
  const t=((r.x-p.x)*(-r.dy)-(r.y-p.y)*(-r.dx))/det,v=[p.x+p.dx*t,p.y+p.dy*t];return Math.hypot(v[0]-q[0],v[1]-q[1])<dg*.02?v:q})}
function detectCV(c,mD=400,refine=false,hint=null){
 const k=Math.min(1,mD/Math.max(c.width,c.height)),w=Math.round(c.width*k),h=Math.round(c.height*k),n=w*h,T=[],M=m=>{T.push(m);return m};
 const dflt=[[.05,.05],[.95,.05],[.95,.95],[.05,.95]].map(p=>[p[0]*c.width,p[1]*c.height]);
 try{
  const full=M(cv.imread(c)),sm=M(new cv.Mat()),gray=M(new cv.Mat()),bl=M(new cv.Mat()),ed=M(new cv.Mat()),edD=M(new cv.Mat()),bw=M(new cv.Mat());
  cv.resize(full,sm,new cv.Size(w,h),0,0,cv.INTER_AREA);cv.cvtColor(sm,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,bl,new cv.Size(5,5),0);
  cv.Canny(bl,ed,30,90);const k3=M(cv.Mat.ones(3,3,cv.CV_8U)),k5=M(cv.Mat.ones(5,5,cv.CV_8U)),k9=M(cv.Mat.ones(9,9,cv.CV_8U)),k15=M(cv.Mat.ones(15,15,cv.CV_8U));
  const satM=M(new cv.Mat(h,w,cv.CV_8UC1)),sd=sm.data;for(let i=0;i<n;i++){const r=sd[i*4],g=sd[i*4+1],b=sd[i*4+2],mxv=Math.max(r,g,b);satM.data[i]=mxv?(mxv-Math.min(r,g,b))*255/mxv:0}
  cv.dilate(ed,edD,k3,new cv.Point(-1,-1),1);
  const srcs=[],a1=M(new cv.Mat());cv.dilate(ed,a1,k3,new cv.Point(-1,-1),2);srcs.push([a1,cv.RETR_LIST]);
  cv.threshold(bl,bw,0,255,cv.THRESH_BINARY|cv.THRESH_OTSU);const sl=M(new cv.Mat()),bc=M(new cv.Mat());cv.threshold(satM,sl,80,255,cv.THRESH_BINARY_INV);cv.bitwise_and(bw,sl,bc);
  for(const m of[bw,bc]){cv.morphologyEx(m,m,cv.MORPH_CLOSE,k5);cv.morphologyEx(m,m,cv.MORPH_OPEN,k9);srcs.push([m,cv.RETR_EXTERNAL])}
  const D=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]),e=Math.max(2,w*.012),res=[];
  const extra=Q=>{const cx=w/2,cy=h/2;for(let j=0;j<4;j++){const a=Q[j],b=Q[(j+1)%4];if((b[0]-a[0])*(cy-a[1])-(b[1]-a[1])*(cx-a[0])<0)return{why:'請把文件對準畫面中央'}}
   const mk=M(cv.Mat.zeros(h,w,cv.CV_8U)),pm=M(cv.matFromArray(4,1,cv.CV_32SC2,Q.flat().map(Math.round))),inn=M(new cv.Mat()),dl=M(new cv.Mat()),ring=M(new cv.Mat());
   cv.fillConvexPoly(mk,pm,new cv.Scalar(255));cv.erode(mk,inn,k9);cv.dilate(mk,dl,k15);cv.subtract(dl,mk,ring);
   const I=cv.mean(bl,inn)[0],O=cv.mean(bl,ring)[0],S=cv.mean(satM,inn)[0],ct=I-O;
   if(ct<12)return{why:'文件需比周圍背景亮，請放在深色桌面'};
   return{f:(Math.min(1,ct/60)+.3)*Math.pow(1-S/255,2)}};
  const sup=(P)=>{let mn=1;for(let i=0;i<4;i++){const a=P[i],b=P[(i+1)%4];let hit=0,tot=0;for(let s=.05;s<=.95;s+=.025){const X=Math.round(a[0]+(b[0]-a[0])*s),Y=Math.round(a[1]+(b[1]-a[1])*s);tot++;if(X>=0&&Y>=0&&X<w&&Y<h&&edD.data[Y*w+X])hit++}mn=Math.min(mn,hit/tot)}return mn};
  for(const[m,mode]of srcs){const cs=M(new cv.MatVector()),hi=M(new cv.Mat());cv.findContours(m,cs,hi,mode,cv.CHAIN_APPROX_SIMPLE);
   for(let i=0;i<cs.size();i++){const ct=cs.get(i);const ar=cv.contourArea(ct);if(ar<n*.1){ct.delete();continue}
    const hull=new cv.Mat();cv.convexHull(ct,hull,false,true);const ha=cv.contourArea(hull),pr=cv.arcLength(hull,true);let P=null;
    for(const f of[.02,.03,.04,.06]){const ap=new cv.Mat();cv.approxPolyDP(hull,ap,pr*f,true);if(ap.rows===4){P=[];for(let j=0;j<4;j++)P.push([ap.data32S[j*2],ap.data32S[j*2+1]]);ap.delete();break}ap.delete()}

  else if(stab<NEED)t='偵測到文件，請保持穩定…';
  else{const w=lastShot+IV()*1000-Date.now();if(w>0)t='文件已就緒｜下次拍攝：'+Math.ceil(w/1000)+' 秒（已存 '+pages.length+' 頁）';else{capture();return}}
  say(t)}finally{ltb=false}}
async function capture(){busy=true;say('拍攝處理中…');await new Promise(r=>setTimeout(r,30));let msg='';
 try{const bm=$('bk').value,v=$('vid'),k=Math.min(1,(bm!=='1'?3200:2000)/Math.max(v.videoWidth,v.videoHeight)),fr=mk(Math.round(v.videoWidth*k),Math.round(v.videoHeight*k));
  fr.getContext('2d').drawImage(v,0,0,fr.width,fr.height);const r=DET(fr,640,1); // 拍攝瞬間以較高解析度再確認一次
  if(!r.ok){stab=0;msg='拍攝瞬間未確認到完整文件，不拍（'+r.why+'）'}
  else{src=fr;const o={sh:$('ash').checked,fg:$('afg').checked,md:$('amd').value,br:0,ct:1,rot:0};let Qs=[r.pts];
   if(bm!=='1'){corners=r.pts;raw=warp();const f=findSpine(raw),A=mp(f*raw.width,0),B=mp(f*raw.width,raw.height),[tl,tr,br,bl]=r.pts,Ql=[tl,A,B,bl],Qr=[A,tr,br,B];Qs=bm==='L'?[Ql]:bm==='R'?[Qr]:[Ql,Qr]} // 沿書脊把四邊形切成左右兩頁
   const su=fr.toDataURL('image/jpeg',.88),outs=Qs.map(Q=>{corners=Q;raw=warp();const t=autoTrim(raw,corners);if(t){corners=t;raw=warp()}return{out:process(raw,o),c:corners.map(c=>c.slice())}}),sg=gray48(outs[0].out);lastShot=Date.now();
   if($('adup').checked&&lastSig&&sg.reduce((a,x,i)=>a+Math.abs(x-lastSig[i]),0)/sg.length<3)msg='與上一頁相同，已略過';
   else{shutter();outs.forEach(({out,c})=>pages.push({url:out.toDataURL('image/jpeg',.92),w:out.width,h:out.height,srcUrl:su,corners:c,opts:o}));lastSig=sg;list();msg='✅ 已儲存 '+outs.length+' 頁（共 '+pages.length+' 頁）'}}
 }catch(e){msg='錯誤：'+(e.message||e)}
 msgUntil=Date.now()+1500;busy=false;say(msg)}
$('closeauto').onclick=()=>{running=false;stopLive();$('go').textContent='▶ 開始';stream&&stream.getTracks().forEach(t=>t.stop());stream=null;show(0,0,1,0)};
$('go').onclick=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
 if(running){running=false;$('go').textContent='▶ 開始';say('已停止，共 '+pages.length+' 頁');return}
 running=true;lastSig=null;lastShot=0;$('go').textContent='⏸ 停止'};

function loadCV(i){if(i>=CVURL.length){$('cvst').textContent='⚠ 精準偵測模組載入失敗，使用基本偵測';return}
